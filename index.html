<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brawl Stats Pro | En Detaylı Analiz</title>
    <style>
         :root {
            --primary: #fbc02d;
            --dark: #121212;
            --card: #1e1e1e;
            --text: #ffffff;
        }
        
        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--dark);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            text-align: center;
        }
        
        .search-box {
            display: flex;
            gap: 10px;
            margin: 30px 0;
        }
        
        input {
            flex: 1;
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #333;
            background: #252525;
            color: white;
            font-size: 18px;
        }
        
        button {
            padding: 15px 30px;
            background: var(--primary);
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        
        button:hover {
            transform: scale(1.05);
            background: #fff;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 25px;
        }
        
        .stat-card {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 12px;
            border-bottom: 3px solid var(--primary);
        }
        
        .brawlers-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
            margin-top: 30px;
        }
        
        .b-card {
            background: #252525;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85em;
        }
        
        .loader {
            display: none;
            border: 4px solid #333;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
        
        #result {
            display: none;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>BRAWL ANALYTICS 🌵</h1>
        <div class="search-box">
            <input type="text" id="tag" placeholder="Oyuncu Etiketi (örn: 9PP9L9)">
            <button onclick="getData()">SORGULA</button>
        </div>

        <div class="loader" id="loader"></div>

        <div id="result">
            <h2 id="name" style="color: var(--primary)"></h2>
            <div class="stats-grid">
                <div class="stat-card">Rekor<br><span id="h-trophies"></span> 📈</div>
                <div class="stat-card">Kupa<br><span id="c-trophies"></span> 🏆</div>
                <div class="stat-card">3v3 Zafer<br><span id="v33"></span> ⚔️</div>
                <div class="stat-card">Solo Zafer<br><span id="vs"></span> 👤</div>
            </div>
            <h3>Karakterlerin</h3>
            <div id="brawlers" class="brawlers-list"></div>
        </div>
    </div>

    <script>
        async function getData() {
            const tag = document.getElementById('tag').value.trim();
            const loader = document.getElementById('loader');
            const result = document.getElementById('result');

            if (!tag) return alert("Tag girin! ⚠️");

            loader.style.display = 'block';
            result.style.display = 'none';

            try {
                // Vercel API endpoint'imize istek atıyoruz
                const res = await fetch(`/api/get-stats?tag=${tag}`);
                const data = await res.json();

                if (data.error) throw new Error(data.error);

                document.getElementById('name').innerText = data.name;
                document.getElementById('h-trophies').innerText = data.highestTrophies;
                document.getElementById('c-trophies').innerText = data.trophies;
                document.getElementById('v33').innerText = data['3vs3Victories'];
                document.getElementById('vs').innerText = data.soloVictories;

                const bList = document.getElementById('brawlers');
                bList.innerHTML = '';
                data.brawlers.sort((a, b) => b.trophies - a.trophies).slice(0, 15).forEach(b => {
                    bList.innerHTML += `<div class="b-card"><b>${b.name}</b><br>${b.trophies} 🏆</div>`;
                });

                result.style.display = 'block';
            } catch (err) {
                alert(err.message);
            } finally {
                loader.style.display = 'none';
            }
        }
    </script>
</body>

</html>
